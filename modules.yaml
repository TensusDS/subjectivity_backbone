# Subjectivity Backbone — Module Configuration
#
# Modules are fetched from external sources and validated before activation.
# Run `backbone fetch` to download and validate all enabled modules.

version: "1.0"

modules:
  - name: turing-pyramid
    source: clawhub://turing-pyramid@1.10.11
    description: "Needs and motivation system with decay and cross-impact"
    enabled: true

